<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Arsip versi halaman utama NFShark.">
  <title>Arsip Halaman — NFShark</title>
  <style>
    :root{color-scheme:dark;--bg:#071512;--surface:#10231e;--text:#f4f7f4;--muted:#aabbb3;--mint:#a8e6c1;--line:#29453a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif}
    main{width:min(760px,calc(100% - 32px));margin:clamp(48px,10vh,100px) auto}
    a{color:var(--mint)}.eyebrow{color:var(--mint);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.1;margin:.6rem 0 1rem}
    .intro{color:var(--muted);max-width:58ch}.list{display:grid;gap:12px;margin:32px 0;padding:0;list-style:none}
    .item{padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
    .item a{font-weight:700;text-decoration:none}.item p{margin:6px 0 0;color:var(--muted);font-size:.9rem}
    .status{color:var(--muted)}.back{display:inline-block;margin-top:18px}
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">NFShark · Dokumentasi</span>
    <h1>Arsip halaman</h1>
    <p class="intro">Daftar versi halaman utama yang pernah dipublikasikan. Daftar ini membaca folder <code>history/</code> secara otomatis, sehingga versi baru akan muncul setelah folder versi berisi file <code>index.html</code> ditambahkan ke GitHub.</p>
    <ul class="list" id="history-list"><li class="item status" id="history-status">Memuat daftar arsip…</li></ul>
    <a class="back" href="../">← Kembali ke NFShark</a>
  </main>
  <script>
    (async () => {
      const list = document.getElementById('history-list');
      const status = document.getElementById('history-status');
      try {
        const response = await fetch('https://api.github.com/repos/GoldenIShark/GoldenIShark.github.io/contents/history?ref=main', {headers:{Accept:'application/vnd.github+json'}});
        if (!response.ok) throw new Error('GitHub API ' + response.status);
        const entries = await response.json();
        const versions = entries.filter(item => item.type === 'dir' && /^index-v[0-9]+$/i.test(item.name)).sort((a,b) => Number(b.name.match(/[0-9]+/)[0]) - Number(a.name.match(/[0-9]+/)[0]));
        const available = [];
        for (const version of versions) {
          try {
            const check = await fetch('https://api.github.com/repos/GoldenIShark/GoldenIShark.github.io/contents/' + encodeURIComponent(version.path) + '/index.html?ref=main', {headers:{Accept:'application/vnd.github+json'}});
            if (check.ok) available.push(version);
          } catch (_) {}
        }
        list.replaceChildren();
        if (!available.length) {
          const empty = document.createElement('li'); empty.className='item status'; empty.textContent='Belum ada arsip versi yang tersedia.'; list.append(empty); return;
        }
        available.forEach(version => {
          const item = document.createElement('li'); item.className='item';
          const link = document.createElement('a'); link.href=version.name + '/'; link.textContent='Tampilan Klasik (' + version.name.toUpperCase() + ')';
          const note = document.createElement('p'); note.textContent='Buka arsip halaman utama versi ' + version.name + '.';
          item.append(link,note); list.append(item);
        });
      } catch (error) {
        status.textContent='Daftar arsip tidak dapat dimuat saat ini. Periksa koneksi internet atau buka folder history di GitHub.';
      }
    })();
  </script>
</body>
</html>
