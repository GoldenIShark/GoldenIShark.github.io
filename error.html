<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Halaman Tidak Ditemukan — NFShark</title>
  <style>
    :root{color-scheme:dark;--bg:#071512;--surface:#10231e;--text:#f4f7f4;--muted:#aabbb3;--mint:#a8e6c1;--line:#29453a}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif}
    main{width:min(600px,100%);padding:clamp(28px,6vw,52px);border:1px solid var(--line);border-radius:20px;background:var(--surface);text-align:center}
    .code{font-size:clamp(4rem,16vw,7rem);font-weight:800;line-height:1;color:var(--mint);letter-spacing:-.08em}
    h1{font-size:clamp(1.5rem,5vw,2.2rem);margin:20px 0 8px}p{color:var(--muted)}
    a{display:inline-block;margin-top:16px;padding:12px 20px;border-radius:9px;background:var(--mint);color:#071512;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Halaman tidak ditemukan</h1>
    <p>Alamat yang Anda buka mungkin salah, sudah dipindahkan, atau halaman tersebut tidak tersedia.</p>
    <a href="/">Kembali ke halaman utama</a>
  </main>
</body>
</html>
